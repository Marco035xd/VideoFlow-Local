<dialog id="arcadeDialog" class="arcade-dialog" aria-labelledby="arcadeTitle" aria-describedby="arcadeInstructions">
  <div class="arcade-heading"><div><span class="eyebrow">SECRETO DESBLOQUEADO · ↑ ↑ ↓ ↓ ← → ← → B A</span><h2 id="arcadeTitle">VideoFlow Arcade</h2></div><button id="arcadeClose" class="secondary-button" type="button" aria-label="Cerrar arcade">Cerrar</button></div>
  <p id="arcadeInstructions">Atrapa las notas con tu nave durante 30 segundos. Muévete con ← →, A / D, el mouse o los botones de abajo.</p>

  <div class="arcade-actions"><div class="arcade-steering"><button id="arcadeLeft" class="secondary-button" type="button" aria-label="Mover nave a la izquierda">←</button><button id="arcadeRight" class="secondary-button" type="button" aria-label="Mover nave a la derecha">→</button></div><p id="arcadeStatus" role="status">Un pequeño secreto para acompañar tus descargas.</p><button id="arcadeStart" class="primary-button" type="button">Jugar</button></div>
