{% from 'player_controls.html' import controls %}
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>VideoFlow · Reproductor</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101827;color:white;font:14px system-ui}
body,.floating-shell{height:100%;display:flex;flex-direction:column}.floating-shell video{height:0;min-height:0;flex:1}
button{padding:8px 13px;border:1px solid #40516c;border-radius:9px;color:white;background:#243755;cursor:pointer}button:hover{background:#304b76}button:focus-visible{outline:2px solid #7ea4ff}
p{margin:0;font-size:12px;color:#c4cee0;flex:1;min-width:180px}
</style><link rel="stylesheet" href="/static/player.css"></head><body>
<div id="floatingShell" class="floating-shell media-shell"><video id="floatingVideo" autoplay playsinline preload="metadata" tabindex="0" aria-label="Video local" src="/api/media/{{ token }}"></video>{{ controls('floating') }}<p id="floatingMessage" role="status"></p></div>
<script src="/static/player.js"></script><script>
new LocalPlayback(document.querySelector('#floatingVideo'), {playButton:document.querySelector('#floatingPlay'),restartButton:document.querySelector('#floatingRestart'),message:document.querySelector('#floatingMessage')}).bindControls('floating',document.querySelector('#floatingShell'));
</script></body></html>
