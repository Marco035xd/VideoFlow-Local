<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>VideoFlow · Reproductor</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101827;color:white;font:14px system-ui}
body{display:flex;flex-direction:column}video{display:block;width:100%;height:0;min-height:0;flex:1;object-fit:contain}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#141e30}
button{padding:8px 13px;border:1px solid #40516c;border-radius:9px;color:white;background:#243755;cursor:pointer}button:hover{background:#304b76}button:focus-visible{outline:2px solid #7ea4ff}
p{margin:0;font-size:12px;color:#c4cee0;flex:1;min-width:180px}
</style></head><body>
<video id="floatingVideo" controls autoplay playsinline preload="metadata" tabindex="0" src="/api/media/{{ token }}"></video>
<div class="controls"><button id="floatingPlay" type="button">Reproducir</button><button id="floatingRestart" type="button">Reiniciar</button><p id="floatingMessage" role="status"></p></div>
<script src="/static/player.js"></script><script>
new LocalPlayback(document.querySelector('#floatingVideo'), {playButton:document.querySelector('#floatingPlay'),restartButton:document.querySelector('#floatingRestart'),message:document.querySelector('#floatingMessage')});
</script></body></html>
