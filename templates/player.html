{% from 'player_controls.html' import controls, volume_control %}
<!doctype html>
<html lang="{{ ui_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoFlow · Reproductor</title>
  <style>:root { {% for key,value in (palette|default({})).items() %}{{ key }}:{{ value }};{% endfor %} }</style>
  <link rel="stylesheet" href="/static/player.css">
  <link rel="stylesheet" href="/static/floating-player.css">
</head>
<body class="floating-body">
  <div id="floatingShell" class="floating-shell media-shell {{ 'pip-shell' if mode == 'pip' else '' }}">
    <header class="player-window-header">
      <span class="pywebview-drag-region">VideoFlow · Reproductor <small>Arrastra para mover</small></span>
      <button id="floatingSmaller" type="button" aria-label="Reducir ventana" title="Reducir ventana">−</button>
      <button id="floatingLarger" type="button" aria-label="Agrandar ventana" title="Agrandar ventana">+</button>
      <button id="floatingCustomize" type="button" aria-label="Personalizar ventana" title="Personalizar ventana">⚙</button>
      <button id="floatingReturn" type="button" aria-label="Volver al reproductor principal" title="Volver al reproductor principal">↗</button>
      <button id="floatingClose" type="button" aria-label="Cerrar ventana" title="Cerrar ventana">×</button>
    </header>
    <video id="floatingVideo" class="{{ 'pywebview-drag-region' if mode == 'pip' else '' }}" playsinline preload="metadata" tabindex="0" aria-label="Video local. Haz clic para reproducir o pausar." src="/api/media/{{ token }}"></video>
    {{ controls('floating', jumps=true, show_volume=mode != 'pip') }}
    <p id="floatingMessage" role="status"></p>
    <dialog id="floatingOptions" aria-labelledby="floatingOptionsTitle">
      <div class="floating-options-header">
        <strong id="floatingOptionsTitle">Personalizar ventana</strong>
        <form method="dialog"><button type="submit" aria-label="Cerrar opciones" title="Cerrar opciones">×</button></form>
      </div>
      {% if mode == 'pip' %}{{ volume_control('floating') }}{% endif %}
      <label class="floating-opacity" for="floatingOpacity"><span>Opacidad</span><output id="floatingOpacityValue">100 %</output></label>
      <input id="floatingOpacity" class="media-range" type="range" min="25" max="100" step="1" value="100">
      <div class="floating-background-actions">
        <button id="floatingPhoto" class="primary-button" type="button">Elegir foto de fondo</button>
        <button id="floatingClear" class="secondary-button" type="button">Quitar foto</button>
      </div>
      <p id="floatingOptionsMessage" role="status"></p>
    </dialog>
  </div>
  <script id="floatingBoot" type="application/json">{{ {'token': token, 'preferences': preferences}|tojson }}</script>
  <script src="/static/language.js"></script>
  <script src="/static/appearance.js"></script>
  <script src="/static/player.js"></script>
  <script src="/static/floating-player.js"></script>
</body>
</html>
